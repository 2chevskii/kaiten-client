name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install actionlint and check workflows
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            --dir "$RUNNER_TEMP/actionlint"
          (cd "$RUNNER_TEMP/actionlint" && sha256sum --ignore-missing --check "actionlint_${ACTIONLINT_VERSION}_checksums.txt")
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color

  quality:
    name: Quality and documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all repository checks
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: npm run check
      - name: Verify npm package
        run: npm run test:package
      - name: Upload checked package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 14
      - name: Upload checked documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        node: [20, 22, 24]
        include:
          - os: windows-2025
            node: 22
          - os: macos-26
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Verify installed npm package
        run: npm run test:package
