name: Finish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ matrix.registry }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: [npm, github]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: ${{ matrix.registry == 'npm' && 'https://registry.npmjs.org' || 'https://npm.pkg.github.com' }}
          scope: '@2chevskii'
      - id: version
        run: echo "package=2chevskii-kaiten-client-${RELEASE_TAG#v}.tgz" >> "$GITHUB_OUTPUT"
      - env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --pattern "$PACKAGE" --dir artifacts
      - env:
          NODE_AUTH_TOKEN: ${{ matrix.registry == 'npm' && secrets.NPM_TOKEN || '' }}
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          REGISTRY_KIND: ${{ matrix.registry }}
          REGISTRY: ${{ matrix.registry == 'npm' && 'https://registry.npmjs.org' || 'https://npm.pkg.github.com' }}
          PACKAGE: artifacts/${{ steps.version.outputs.package }}
        run: |
          if [ "$REGISTRY_KIND" = github ]; then
            export NODE_AUTH_TOKEN="$GITHUB_PACKAGES_TOKEN"
          fi
          if [ "$REGISTRY_KIND" = npm ]; then
            npm publish "$PACKAGE" --registry "$REGISTRY" --access public --provenance --ignore-scripts
          else
            npm publish "$PACKAGE" --registry "$REGISTRY" --ignore-scripts
          fi
