name: CI

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all repository checks
        env:
          VITEPRESS_BASE: /${{ github.event.repository.name }}/
        run: npm run check
      - name: Verify npm package
        run: npm run test:package
      - name: Upload checked package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 14
      - name: Upload checked documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Verify installed npm package
        run: npm run test:package

  deploy-docs:
    name: Deploy documentation
    needs: [quality, compatibility]
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Download checked documentation
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
