name: Start release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      package: ${{ steps.version.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          jq -er --arg tag "$RELEASE_TAG" '
            if ($tag == ("v" + .version)) and
               ($tag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) then
              "package=2chevskii-kaiten-client-\(.version).tgz"
            else
              error("Release tag must use vX.Y.Z and match package.json version")
            end
          ' package.json >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: validate-release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PACKAGE: ${{ needs.validate-release.outputs.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm run build
          mkdir -p artifacts
          npm pack
      - working-directory: artifacts
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null; then
            gh release upload "$RELEASE_TAG" "$PACKAGE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE" \
              --draft --verify-tag --title "Kaiten Client $RELEASE_TAG" --generate-notes
          fi
