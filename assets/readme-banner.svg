  <g clip-path="url(#art)"><rect x="1040" y="20" width="480" height="480" fill="#0c0d15"/><rect x="1040" y="20" width="480" height="480" fill="url(#red)"/><rect x="1040" y="20" width="480" height="480" fill="url(#violet)"/><rect x="1040" y="20" width="480" height="480" fill="url(#mint)"/><rect x="1040" y="20" width="480" height="480" fill="url(#dots)"/></g>
  <rect x="1040" y="20" width="480" height="480" rx="52" fill="none" stroke="#30303d" stroke-width="2"/>
  <circle cx="1191" cy="260" r="88" fill="#ff2028"/>
