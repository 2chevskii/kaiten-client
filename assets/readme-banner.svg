  <title id="title">Kaiten Client</title>
  <desc id="desc">Typed connections to Kaiten</desc>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#aaa3c4" opacity=".28"/></pattern>
    <radialGradient id="red" cx="0" cy="0" r="1" gradientTransform="translate(1040 20) scale(240)" gradientUnits="userSpaceOnUse"><stop stop-color="#e62c3a" stop-opacity=".5"/><stop offset="1" stop-color="#e62c3a" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientTransform="translate(1040 500) scale(240)" gradientUnits="userSpaceOnUse"><stop stop-color="#7836d2" stop-opacity=".5"/><stop offset="1" stop-color="#7836d2" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint" cx="0" cy="0" r="1" gradientTransform="translate(1520 500) scale(240)" gradientUnits="userSpaceOnUse"><stop stop-color="#20bd9c" stop-opacity=".44"/><stop offset="1" stop-color="#20bd9c" stop-opacity="0"/></radialGradient>
    <clipPath id="banner"><rect width="1600" height="520" rx="36"/></clipPath>
